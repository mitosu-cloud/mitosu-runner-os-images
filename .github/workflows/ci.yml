name: repository-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MITOSU_BUILD_ROOT: /tmp/mitosu-runner-os-images

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  contract:
    name: Validate repository contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq python3-jsonschema shellcheck

      - name: Record tool versions
        run: |
          jq --version
          jsonschema --version
          shellcheck --version

      - name: Validate and test
        run: |
          make test
          make lint

      - name: Resolve matrix report
        run: ./scripts/resolve-matrix.sh --output /tmp/mitosu-runner-os-images/reports/resolved-matrix.json

      - name: Upload resolved matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resolved-matrix
          path: /tmp/mitosu-runner-os-images/reports/resolved-matrix.json
          if-no-files-found: error
          retention-days: 7
