name: Protected runtime-pack release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source revision containing the release contract
        required: true
        type: string
      release_tag:
        description: Immutable tag; must equal runtime-pack- plus the manifest pack_id
        required: true
        type: string
      candidate_run_id:
        description: Successful protected staging workflow run containing the immutable candidate artifact
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 of the unsigned candidate archive
        required: true
        type: string
      source_base_url:
        description: GitHub Release download directory for the immutable release tag
        required: true
        type: string

concurrency:
  group: runtime-pack-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  validate-candidate:
    name: Validate reviewed release source
    runs-on: [self-hosted, Linux, ARM64, runtime-pack-release]
    timeout-minutes: 45
    permissions:
      attestations: read
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      MITOSU_BUILD_ROOT: /tmp/mitosu-runner-os-images-${{ github.run_id }}-${{ github.run_attempt }}-validate
    outputs:
      pack_id: ${{ steps.inputs.outputs.pack_id }}
      candidate_artifact: ${{ steps.inputs.outputs.candidate_artifact }}
    steps:
      - name: Validate immutable inputs
        id: inputs
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_BASE_URL: ${{ inputs.source_base_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SOURCE_BASE_URL" == https://* ]]
          [[ "$SOURCE_BASE_URL" != *\?* && "$SOURCE_BASE_URL" != *\#* ]]
          [[ "$SOURCE_BASE_URL" == */ ]]
          expected_source="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/"
          test "$SOURCE_BASE_URL" = "$expected_source"
          [[ "$RELEASE_TAG" == runtime-pack-* ]]
          printf 'pack_id=%s\n' "${RELEASE_TAG#runtime-pack-}" >> "$GITHUB_OUTPUT"
          printf 'candidate_artifact=runtime-pack-candidate-%s\n' \
            "$CANDIDATE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify source and install validation tools
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          sudo apt-get update
          sudo apt-get install --yes jq python3-jsonschema shellcheck zstd
          make test
          make lint

  sign-runtime-pack:
    name: Validate, sign, and stage reviewed runtime pack
    needs: validate-candidate
    runs-on: [self-hosted, Linux, ARM64, runtime-pack-release]
    timeout-minutes: 45
    environment: runtime-release
    permissions:
      actions: read
      contents: write
      attestations: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      MITOSU_BUILD_ROOT: /tmp/mitosu-runner-os-images-${{ github.run_id }}-${{ github.run_attempt }}-sign
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install validation tools
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          sudo apt-get update
          packages=(acl ca-certificates curl jq python3-jsonschema zstd)
          if ! command -v docker >/dev/null 2>&1; then
            packages+=(docker.io)
          fi
          sudo apt-get install --yes --no-install-recommends "${packages[@]}"
          sudo systemctl start docker
          test -S /var/run/docker.sock
          sudo setfacl -m "u:$(id -un):rw" /var/run/docker.sock
          docker version

      - name: Install pinned GitHub CLI
        run: |
          ./scripts/install-pinned-gh.sh "$RUNNER_TEMP/gh-cli"
          printf '%s\n' "$RUNNER_TEMP/gh-cli" >> "$GITHUB_PATH"

      - name: Verify protected candidate staging run
        env:
          CANDIDATE_ARTIFACT: ${{ needs.validate-candidate.outputs.candidate_artifact }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          run_record=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            --jq '[.conclusion, .event, .head_sha, .path] | @tsv')
          IFS=$'\t' read -r conclusion event head_sha workflow_path <<< "$run_record"
          test "$conclusion" = success
          test "$event" = workflow_dispatch
          test "$head_sha" = "$SOURCE_SHA"
          test "$workflow_path" = .github/workflows/stage-runtime-pack-candidate.yml
          artifact_json=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts")
          match_count=$(jq -er --arg name "$CANDIDATE_ARTIFACT" \
            '[.artifacts[] | select(.name == $name and (.expired | not))] | length' \
            <<< "$artifact_json")
          test "$match_count" -eq 1

      - name: Download immutable candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.validate-candidate.outputs.candidate_artifact }}
          path: /tmp/mitosu-runner-os-images-${{ github.run_id }}-${{ github.run_attempt }}-sign/release-input/artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Validate candidate artifact
        id: candidate
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          install -d -m 0700 "$MITOSU_BUILD_ROOT/release-input"
          artifact_dir="$MITOSU_BUILD_ROOT/release-input/artifact"
          entry_count=$(find "$artifact_dir" -mindepth 1 -maxdepth 1 -printf . | wc -c)
          test "$entry_count" -eq 1
          mapfile -d '' candidate_files < <(
            find "$artifact_dir" -mindepth 1 -maxdepth 1 -type f -print0
          )
          test "${#candidate_files[@]}" -eq 1
          candidate="$MITOSU_BUILD_ROOT/release-input/candidate.tar"
          mv -- "${candidate_files[0]}" "$candidate"
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$candidate" | sha256sum --check --strict
          ./scripts/extract-runtime-pack-candidate.py \
            "$candidate" "$MITOSU_BUILD_ROOT/release-input/extracted"
          pack="$MITOSU_BUILD_ROOT/release-input/extracted/pack"
          ./scripts/validate-production-runtime-pack.sh --pack-dir "$pack" --github-release
          pack_id=$(jq -er '.pack_id' "$pack/manifest.json")
          test "$RELEASE_TAG" = "runtime-pack-$pack_id"
          printf 'pack_id=%s\n' "$pack_id" >> "$GITHUB_OUTPUT"

      - name: Verify OCI image provenance
        run: |
          pack="$MITOSU_BUILD_ROOT/release-input/extracted/pack"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          cleanup_registry() {
            docker logout ghcr.io >/dev/null 2>&1 || true
          }
          trap cleanup_registry EXIT
          while IFS= read -r reference; do
            gh attestation verify "oci://$reference" \
              --owner mitosu-cloud
          done < <(jq -er '.oci_images[].reference' "$pack/manifest.json")
          cleanup_registry
          trap - EXIT

      - name: Revalidate, sign, and stage
        id: release
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          PACK_ID: ${{ needs.validate-candidate.outputs.pack_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SIGNING_KEY_PEM: ${{ secrets.MITOSU_RUNTIME_PACK_SIGNING_KEY_PEM }}
          SOURCE_BASE_URL: ${{ inputs.source_base_url }}
        run: |
          expected_public_key=$(tr -d '[:space:]' < release/runtime-pack-ed25519-public-key.hex)
          [[ "$expected_public_key" =~ ^[a-f0-9]{64}$ ]]
          [[ -n "$SIGNING_KEY_PEM" ]]
          candidate="$MITOSU_BUILD_ROOT/release-input/candidate.tar"
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$candidate" | sha256sum --check --strict
          pack="$MITOSU_BUILD_ROOT/release-input/extracted/pack"
          ./scripts/validate-production-runtime-pack.sh --pack-dir "$pack" --github-release >/dev/null
          test "$(jq -er '.pack_id' "$pack/manifest.json")" = "$PACK_ID"

          key_file="$RUNNER_TEMP/runtime-pack-signing-key.pem"
          cleanup_key() {
            rm -f -- "$key_file"
          }
          trap cleanup_key EXIT
          (umask 077; printf '%s\n' "$SIGNING_KEY_PEM" > "$key_file")
          unset SIGNING_KEY_PEM
          ./scripts/sign-runtime-pack.sh \
            --pack-dir "$pack" \
            --private-key "$key_file" \
            --source "$SOURCE_BASE_URL" >/dev/null
          cleanup_key
          trap - EXIT
          test "$(tr -d '[:space:]' < "$pack/ed25519-public-key.hex")" = "$expected_public_key"
          ./scripts/verify-runtime-pack.sh \
            --pack-dir "$pack" \
            --public-key "$expected_public_key" >/dev/null

          release_dir="$MITOSU_BUILD_ROOT/release-output"
          install -d -m 0700 "$release_dir"
          # The signed source inventory is already compressed and flat.
          cp -- "$pack/"* "$release_dir/"
          (
            cd "$release_dir"
            sha256sum -- * > SHA256SUMS
          )
          while IFS= read -r -d '' asset; do
            test "$(stat -c %s "$asset")" -lt 2147483648
          done < <(find "$release_dir" -maxdepth 1 -type f -print0)

      - name: Upload signed release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.release_tag }}
          path: /tmp/mitosu-runner-os-images-${{ github.run_id }}-${{ github.run_attempt }}-sign/release-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    name: Attest, publish, and verify immutable GitHub assets
    needs: [validate-candidate, sign-runtime-pack]
    runs-on: [self-hosted, Linux, ARM64, runtime-pack-publish]
    timeout-minutes: 60
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_DIR: /tmp/mitosu-runner-os-images-${{ github.run_id }}-${{ github.run_attempt }}-publish/release-output
    steps:
      - name: Download signed release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.release_tag }}
          path: /tmp/mitosu-runner-os-images-${{ github.run_id }}-${{ github.run_attempt }}-publish/release-output

      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Reverify signed release bytes
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates curl jq python3-jsonschema zstd
          (cd "$RELEASE_DIR" && sha256sum --check --strict SHA256SUMS)
          install -d -m 0700 "$RUNNER_TEMP/signed-pack"
          cp -- "$RELEASE_DIR/"* "$RUNNER_TEMP/signed-pack/"
          rm -- "$RUNNER_TEMP/signed-pack/SHA256SUMS"
          ./scripts/verify-runtime-pack.sh --pack-dir "$RUNNER_TEMP/signed-pack" \
            --public-key "$(tr -d '[:space:]' < release/runtime-pack-ed25519-public-key.hex)"

      - name: Install pinned GitHub CLI
        id: gh_cli
        run: |
          ./scripts/install-pinned-gh.sh "$RUNNER_TEMP/gh-cli"
          printf '%s\n' "$RUNNER_TEMP/gh-cli" >> "$GITHUB_PATH"

      - name: Attest signed release artifacts
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-checksums: /tmp/mitosu-runner-os-images-${{ github.run_id }}-${{ github.run_attempt }}-publish/release-output/SHA256SUMS

      - name: Publish immutable GitHub release
        id: publish
        env:
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_BASE_URL: ${{ inputs.source_base_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'error: release already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'error: tag already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/runtime-pack-release-notes.md"
          {
            printf "Signed runtime pack \`%s\`.\n\n" "$RELEASE_TAG"
            printf -- "- Source revision: \`%s\`\n" "$SOURCE_SHA"
            printf -- '- Build provenance: %s\n' "$ATTESTATION_URL"
            printf -- "- Installation source: \`%s\`\n" "$SOURCE_BASE_URL"
          } > "$notes"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --draft \
            --title "$RELEASE_TAG" \
            --notes-file "$notes"
          release_id=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId --jq .databaseId)
          ./scripts/upload-runtime-pack-release.sh \
            "$GITHUB_REPOSITORY" "$release_id" "$RELEASE_DIR"
          # Check server-stored bytes before publishing and locking the release.
          install -d -m 0700 "$RUNNER_TEMP/draft-assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/draft-assets"
          diff --recursive -- "$RELEASE_DIR" "$RUNNER_TEMP/draft-assets"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          test "$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isImmutable \
            --jq .isImmutable)" = true

      - name: Remove incomplete draft after publication failure
        if: failure() && steps.gh_cli.outcome == 'success' && steps.publish.outcome == 'failure'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_record=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,isDraft \
            --jq '[.databaseId, .isDraft] | @tsv' 2>/dev/null || true)
          if [[ -n "$release_record" ]]; then
            IFS=$'\t' read -r release_id is_draft <<< "$release_record"
            [[ "$release_id" =~ ^[0-9]+$ && "$is_draft" == true ]]
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          fi

      - name: Verify anonymous public GitHub asset delivery
        env:
          SOURCE_BASE_URL: ${{ inputs.source_base_url }}
        run: |
          python3 ./scripts/fetch-runtime-pack-release.py \
            --base-url "$SOURCE_BASE_URL" --expected-pack "$RELEASE_DIR"

      - name: Remove transient workflow artifacts
        if: success()
        env:
          CANDIDATE_ARTIFACT: ${{ needs.validate-candidate.outputs.candidate_artifact }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          while IFS=$'\t' read -r artifact_id artifact_name; do
            if [[ "$artifact_name" == "$RELEASE_TAG" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            fi
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --paginate \
              --jq '.artifacts[] | [.id, .name] | @tsv'
          )
          while IFS=$'\t' read -r artifact_id artifact_name; do
            if [[ "$artifact_name" == "$CANDIDATE_ARTIFACT" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            fi
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts" \
              --paginate \
              --jq '.artifacts[] | [.id, .name] | @tsv'
          )
