name: Stage reviewed runtime-pack candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character runner-images revision containing this workflow
        required: true
        type: string
      candidate_asset_url:
        description: Exact same-repository GitHub API URL for the private draft-release asset
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 of the pre-staged candidate archive
        required: true
        type: string

concurrency:
  group: runtime-pack-candidate-stage
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  stage-candidate:
    name: Upload reviewed candidate as immutable workflow artifact
    runs-on: [self-hosted, Linux, ARM64, runtime-pack-release]
    timeout-minutes: 90
    environment: runtime-release
    permissions:
      actions: write
      # GitHub exposes private draft-release assets only to push-capable tokens.
      # The protected job accepts only this repository's exact numeric asset URL.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Validate immutable inputs
        env:
          CANDIDATE_ASSET_URL: ${{ inputs.candidate_asset_url }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          asset_prefix="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/"
          [[ "$CANDIDATE_ASSET_URL" == "$asset_prefix"* ]]
          asset_id=${CANDIDATE_ASSET_URL#"$asset_prefix"}
          [[ "$asset_id" =~ ^[1-9][0-9]{0,19}$ ]]

      - name: Install pinned GitHub CLI
        run: |
          ./scripts/install-pinned-gh.sh "$RUNNER_TEMP/gh-cli"
          printf '%s\n' "$RUNNER_TEMP/gh-cli" >> "$GITHUB_PATH"

      - name: Download and validate candidate
        id: candidate
        env:
          CANDIDATE_ASSET_URL: ${{ inputs.candidate_asset_url }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          candidate="$RUNNER_TEMP/runtime-pack-candidate-$CANDIDATE_SHA256.tar"
          [[ ! -e "$candidate" && ! -L "$candidate" ]]
          ./scripts/download-runtime-pack-candidate.sh \
            "$CANDIDATE_ASSET_URL" "$candidate"
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$candidate" |
            sha256sum --check --strict
          printf 'path=%s\n' "$candidate" >> "$GITHUB_OUTPUT"

      - name: Upload immutable candidate artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-pack-candidate-${{ inputs.candidate_sha256 }}
          path: ${{ steps.candidate.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove downloaded candidate after verified upload
        if: success()
        env:
          CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
        run: |
          [[ "${{ steps.upload.outputs.artifact-id }}" =~ ^[0-9]+$ ]]
          [[ "${{ steps.upload.outputs.artifact-digest }}" =~ ^[a-f0-9]{64}$ ]]
          rm -- "$CANDIDATE_PATH"
