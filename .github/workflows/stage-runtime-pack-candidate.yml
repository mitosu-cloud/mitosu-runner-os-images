name: Stage reviewed runtime-pack candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character runner-images revision containing this workflow
        required: true
        type: string
      candidate_name:
        description: Pre-staged candidate filename under the protected runner staging directory
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 of the pre-staged candidate archive
        required: true
        type: string

concurrency:
  group: runtime-pack-candidate-stage
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  stage-candidate:
    name: Upload reviewed candidate as immutable workflow artifact
    runs-on: [self-hosted, Linux, ARM64, runtime-pack-release]
    timeout-minutes: 90
    environment: runtime-release
    permissions:
      actions: write
      contents: read
    env:
      STAGING_ROOT: /tmp/mitosu-runtime-pack-candidates
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Validate pre-staged candidate
        id: candidate
        env:
          CANDIDATE_NAME: ${{ inputs.candidate_name }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CANDIDATE_NAME" =~ ^[a-z0-9][a-z0-9._-]{0,191}\.tar$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ -d "$STAGING_ROOT" && ! -L "$STAGING_ROOT" ]]
          test "$(realpath -e -- "$STAGING_ROOT")" = "$STAGING_ROOT"
          candidate="$STAGING_ROOT/$CANDIDATE_NAME"
          [[ -f "$candidate" && ! -L "$candidate" ]]
          test "$(realpath -e -- "$candidate")" = "$candidate"
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$candidate" |
            sha256sum --check --strict
          printf 'path=%s\n' "$candidate" >> "$GITHUB_OUTPUT"

      - name: Upload immutable candidate artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-pack-candidate-${{ inputs.candidate_sha256 }}
          path: ${{ steps.candidate.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove pre-staged candidate after verified upload
        if: success()
        env:
          CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
        run: |
          [[ "${{ steps.upload.outputs.artifact-id }}" =~ ^[0-9]+$ ]]
          [[ "${{ steps.upload.outputs.artifact-digest }}" =~ ^[a-f0-9]{64}$ ]]
          rm -- "$CANDIDATE_PATH"
          rmdir --ignore-fail-on-non-empty -- "$STAGING_ROOT"
