name: Stage reviewed runtime-pack candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character runner-images revision containing this workflow
        required: true
        type: string
      draft_tag:
        description: Existing same-repository draft release tag
        required: true
        type: string
      candidate_name:
        description: Pre-staged candidate filename under the protected runner staging directory
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 of the pre-staged candidate archive
        required: true
        type: string

concurrency:
  group: runtime-pack-candidate-stage
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  stage-candidate:
    name: Upload reviewed candidate to protected draft
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 90
    environment: runtime-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      STAGING_ROOT: /tmp/mitosu-runtime-pack-candidates
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install pinned GitHub CLI
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates curl
          ./scripts/install-pinned-gh.sh "$RUNNER_TEMP/gh-cli"
          printf '%s\n' "$RUNNER_TEMP/gh-cli" >> "$GITHUB_PATH"

      - name: Validate and upload pre-staged candidate
        env:
          CANDIDATE_NAME: ${{ inputs.candidate_name }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DRAFT_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          [[ "$CANDIDATE_NAME" =~ ^[a-z0-9][a-z0-9._-]{0,191}\.tar$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ -d "$STAGING_ROOT" && ! -L "$STAGING_ROOT" ]]
          test "$(realpath -e -- "$STAGING_ROOT")" = "$STAGING_ROOT"
          candidate="$STAGING_ROOT/$CANDIDATE_NAME"
          [[ -f "$candidate" && ! -L "$candidate" ]]
          test "$(realpath -e -- "$candidate")" = "$candidate"
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$candidate" |
            sha256sum --check --strict

          release_record=$(gh release view "$DRAFT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,isDraft \
            --jq '[.databaseId, .isDraft] | @tsv')
          IFS=$'\t' read -r release_id is_draft <<< "$release_record"
          [[ "$release_id" =~ ^[0-9]+$ && "$is_draft" == true ]]

          while IFS=$'\t' read -r _ asset_name _; do
            if [[ "$asset_name" == "$CANDIDATE_NAME" ]]; then
              printf 'error: draft release already has candidate asset: %s\n' "$CANDIDATE_NAME" >&2
              exit 1
            fi
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --paginate --jq '.[] | [.id, .name, .size] | @tsv'
          )

          gh release upload "$DRAFT_TAG" "$candidate" --repo "$GITHUB_REPOSITORY"

          expected_size=$(stat -c %s -- "$candidate")
          match_count=0
          while IFS=$'\t' read -r asset_name asset_size asset_digest; do
            if [[ "$asset_name" == "$CANDIDATE_NAME" ]]; then
              ((match_count += 1))
              test "$asset_size" = "$expected_size"
              test "$asset_digest" = "sha256:$CANDIDATE_SHA256"
            fi
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --paginate --jq '.[] | [.name, .size, .digest] | @tsv'
          )
          test "$match_count" -eq 1
          rm -- "$candidate"
          rmdir --ignore-fail-on-non-empty -- "$STAGING_ROOT"
